<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wellness Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:ital,wght@1,400..900&display=swap" rel="stylesheet">
    <style>
        /* General Setup */
        :root {
            --bg-color: #FFFFFF;
            --container-bg: #F5FAFF;
            --text-color: #1A202C;
            --text-muted: #4A5568;
            --border-color: #E2E8F0;
            --gradient-start: #ff8c42;
            --gradient-end: #ff3c83;
            --font-primary: 'Inter', sans-serif;
            --font-cursive: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-family: var(--font-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6, strong {
            color: var(--text-color);
        }

        #root {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem 1.5rem;
        }

        .logo {
            color: var(--gradient-end);
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            line-height: 1;
        }

        .logo .subtitle {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            position: relative;
            padding-bottom: 4px;
            margin-top: 2px;
        }

        .logo .subtitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            animation: grow-underline 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.3s;
        }

        /* Hero Section */
        .hero-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            overflow: hidden;
        }

        .hero-content {
            display: grid;
            grid-template-areas:
                "title title"
                "text image";
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .hero-title-container {
            grid-area: title;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .hero-text {
            grid-area: text;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .tag-ai {
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            position: relative;
            padding-bottom: 1rem;
            text-align: center;
            background: linear-gradient(90deg, var(--gradient-end), var(--gradient-start));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        #hero-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .cursive {
            font-family: var(--font-cursive);
            font-style: italic;
            font-weight: 600;
        }

        #hero-title .cursive {
            background: none;
            -webkit-text-fill-color: var(--text-color);
            color: var(--text-color);
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .description .highlight {
            background-color: #FEF3C7;
            color: #92400E;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .features {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .feature-tag {
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: var(--bg-color);
        }

        .apply-button {
            background-color: var(--gradient-start);
            color: #fff;
            border: none;
            border-radius: 15px;
            padding: 1.2rem 4rem;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.4);
        }

        .apply-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 75%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: running-shine 2.5s linear infinite;
        }

        .apply-button:hover {
            background-color: var(--gradient-end);
            box-shadow: 0 8px 20px rgba(255, 60, 131, 0.4);
            transform: translateY(-2px);
        }

        .apply-button:active {
            box-shadow: none;
            transform: translateY(0);
        }

        .hero-image {
            grid-area: image;
            width: 100%;
            height: 100%;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        /* Info Cards Section */
        .info-cards {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: -2.5rem; /* Overlap with hero container */
            position: relative;
            z-index: 10;
        }

        .info-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 140px;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(100, 125, 150, 0.06);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out, box-shadow 0.3s ease;
        }

        .info-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(100, 125, 150, 0.1);
        }

        .info-main {
            font-size: 2.2rem;
            font-weight: 500;
            line-height: 1;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .info-unit {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Section Divider */
        .section-divider {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 4rem auto;
        }

        /* Program For Section */
        .program-for-section {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .program-for-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .program-for-title i {
            font-style: italic;
            font-family: var(--font-cursive);
        }

        .program-for-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .program-cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
            margin: 2.5rem 0;
        }

        .program-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .program-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(100, 125, 150, 0.1);
        }

        .program-card img {
            width: 100%;
            height: 450px;
            object-fit: contain;
            display: block;
        }

        .program-card p {
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-height: 60px;
        }

        .counsellor-button {
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1.25rem 2.5rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            max-width: 500px;
            width: 100%;
            font-size: 1.15rem;
            line-height: 1.3;
            animation: shake 0.4s ease-in-out infinite alternate;
            will-change: transform;
            box-shadow: 0 5px 15px rgba(255, 140, 66, 0.3);
        }

        .counsellor-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 60, 131, 0.4);
        }

        /* Outcome Section */
        .outcome-section {
            background-color: #1f1f1f;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            border-radius: 20px;
            margin: 4rem 0;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .outcome-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 1rem;
            color: var(--text-color);
            line-height: 1.3;
        }

        .outcome-title i {
            font-family: var(--font-cursive);
            font-style: italic;
            font-weight: 400;
        }

        .outcome-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .outcome-tags {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        .tag-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: background-color 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .tag-item:hover {
            background-color: var(--container-bg);
            border-color: #A0AEC0;
        }

        .enquire-button {
            color: white;
            border: none;
            border-radius: 8px;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 3rem;
            position: relative;
            z-index: 0;
            transition: box-shadow 0.2s ease-out;
            animation: shake 0.4s ease-in-out infinite alternate;
            will-change: transform;
        }

        .enquire-button::after {
            content: '';
            position: absolute;
            z-index: -1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end), var(--gradient-start));
            background-size: 200% 100%;
            border-radius: 8px;
            transition: background-position 0.5s ease;
        }

        .enquire-button:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .enquire-button:hover::after {
            background-position: right center;
        }

        .max-opportunity-logo {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 3rem;
            background: linear-gradient(90deg, #4A90E2, #81C7F4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            font-family: var(--font-cursive);
            font-style: italic;
            line-height: 1.2;
        }

        .stats-bar {
            background-color: var(--container-bg);
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding: 1.5rem;
            width: 100%;
            margin-top: auto;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            justify-content: center;
        }

        .stat-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: var(--font-cursive);
            font-style: italic;
        }

        /* Learn Section */
        .learn-section {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            margin: 4rem 0;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .learn-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            position: relative;
            padding-bottom: 1rem;
            color: var(--text-color);
            line-height: 1.3;
        }

        .learn-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .learn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .learn-item {
            display: flex;
            align-items: center;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .learn-item::before {
            content: '✓';
            color: var(--gradient-start);
            font-size: 1.5rem;
            font-weight: bold;
            margin-right: 0.75rem;
            line-height: 1;
        }

        .learn-section .enquire-button {
            margin-bottom: 0;
        }


        /* Learning By Doing Section */
        .learning-by-doing-section {
            padding: 4rem 0;
            text-align: center;
        }

        .learning-by-doing-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .learning-by-doing-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .learning-content-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
            align-items: stretch;
            text-align: left;
        }

        .learning-card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .learning-card h3 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .learning-card .underline-text {
            position: relative;
            display: inline-block;
            font-family: var(--font-cursive);
            font-style: italic;
        }

        .learning-card .underline-text::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .gradient-underline {
            position: relative;
            display: inline-block;
        }

        .gradient-underline::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .learning-card p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.9rem;
        }

        /* Left Column - Video Card */
        .video-card {
            justify-content: space-between;
        }

        .coach-image-container {
            margin-top: 1.5rem;
            border-radius: 10px;
            overflow: hidden;
        }

        .coach-image-container img {
            width: 100%;
            display: block;
        }

        /* Right Column */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .ad-budget-card .ad-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .ad-budget-card .ad-stat-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .ad-budget-card .ad-stat-item strong {
            display: block;
            font-size: 1.2rem;
            color: var(--text-color);
            font-weight: 600;
        }

        .journey-button-container {
            text-align: center;
        }

        /* Services Section */
        .services-section {
            padding: 4rem 0;
            text-align: center;
        }

        .services-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .services-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .services-subtitle {
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            text-align: left;
        }

        .service-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(100, 125, 150, 0.1);
        }

        .service-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            background-color: var(--container-bg);
        }

        .service-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .service-description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .service-tag {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .service-tag:hover {
            background-color: #4A90E2;
            color: var(--bg-color);
            border-color: #4A90E2;
        }


        /* FAQ Section */
        .faq-section {
            padding: 4rem 0;
            text-align: center;
        }

        .faq-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .faq-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }

        .faq-item {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            position: relative;
        }

        .faq-question {
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background-color: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            text-align: left;
            font-family: var(--font-primary);
        }

        .faq-icon {
            width: 1em;
            height: 1em;
            position: relative;
            transition: transform 0.3s ease-in-out;
        }

        .faq-icon::before,
        .faq-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 2px;
            background-color: var(--text-muted);
            transform: translate(-50%, -50%);
        }

        .faq-icon::after {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .faq-item.open .faq-icon {
            transform: rotate(45deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
